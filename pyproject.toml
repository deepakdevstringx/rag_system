[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-pdf-rag"
version = "0.1.0"
description = "Local PDF question answering with ChromaDB and Ollama"
requires-python = ">=3.10"
dependencies = [
    "chromadb",
    "ollama",
    "pypdf",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]